<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Ubah Password - Jayantara Panel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            padding: 30px;
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            padding: 11px 18px;
            border: 0;
            border-radius: 6px;
            background: #111827;
            color: white;
            cursor: pointer;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="header">

    <strong>Jayantara Hosting Panel</strong>

    <a href="/dashboard">
        Dashboard
    </a>

    <a href="/logout">
        Logout
    </a>

</div>


<div class="container">

    <h1>Ubah Password</h1>

    <div class="card">

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="success">
                {{ success }}
            </div>
        {% endif %}

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="current_password">
                Password Saat Ini
            </label>

            <input
                type="password"
                id="current_password"
                name="current_password"
                required
                autocomplete="current-password"
            >


            <label for="new_password">
                Password Baru
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                required
                minlength="12"
                autocomplete="new-password"
            >


            <label for="confirm_password">
                Konfirmasi Password Baru
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
                minlength="12"
                autocomplete="new-password"
            >


            <button type="submit">
                Ubah Password
            </button>

        </form>

    </div>

</div>

</body>

</html>
